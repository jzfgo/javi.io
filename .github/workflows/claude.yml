name: Claude Code

# Cada run lleva el número de su PR. Los runs de `issue_comment` se atribuyen
# siempre a la rama por defecto (un comentario no trae ref, así que GitHub lee
# este workflow de `master` e informa `headBranch: master`), y
# `gh run list --branch <rama>` nunca los encuentra. Este nombre los recupera:
#   gh run list --workflow=claude.yml --json databaseId,displayTitle
#
# Tiene que ir entre comillas. Sin ellas, YAML toma el " #" como inicio de un
# comentario y el nombre se queda en "Claude —", sin el número.
run-name: "Claude — #${{ github.event.issue.number || github.event.pull_request.number }}"

# Un PR que edita ESTE ARCHIVO no recibe revisión de Claude.
#
# claude-code-action se niega a ejecutarse si el workflow difiere de la copia de
# la rama por defecto. Es una medida de seguridad: impide que un PR reescriba su
# propio revisor y lo ejecute con los secretos del repo. Pero la negativa sale en
# verde, sin haber revisado nada. El paso de guarda antes de la acción convierte
# ese silencio en un check rojo que dice "revisa este PR a mano".
#
# Los cambios a este archivo tampoco los puede verificar el PR que los hace. Se
# aplican al mergear, y lo que los prueba es el primer PR posterior que NO toque
# este archivo.

on:
  # Revisión automática al abrir el PR. A propósito NO en `synchronize`: una
  # revisión completa en cada push es ruidosa y cara. Las pasadas siguientes se
  # piden con un comentario `@claude`, que cubren los triggers de abajo.
  #
  # A diferencia de `issue_comment`, los runs de `pull_request` SÍ se atribuyen a
  # la rama del PR, así que aparecen en `gh run list --branch <rama>`.
  #
  # No hay trigger `issues`: los issues de GitHub están desactivados en este repo.
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # ESTE REPOSITORIO ES PÚBLICO: cualquiera puede comentar.
    #
    # Solo `pull_request` está protegido porque GitHub no da secretos a los runs
    # de forks. Los otros triggers se ejecutan en el contexto del repo base con
    # todos los secretos, escriba quien escriba el comentario, y en ellos
    # `prompt` va vacío, así que el agente sigue lo que diga el comentario.
    # Filtrar solo por `@claude` dejaría a cualquiera manejar el agente.
    #
    # Por eso cada trigger exige además un autor de confianza. No quites estas
    # comprobaciones.
    #
    # El trigger no basta: el agente puede leer el token con permisos de
    # escritura de la acción (ver `claude_args`), así que todo lo que lee tiene
    # que venir de una cuenta de confianza. Los triggers de comentario exigen
    # también que el autor del PR lo sea, e `include_comments_by_actor` saca del
    # prompt los comentarios de cualquier otra cuenta.
    #
    # Eso no frena el PR de un miembro de confianza desde un fork, que seguiría
    # dándole al agente el código del fork. Por eso el primer paso rechaza los
    # PRs de forks.
    #
    # Como consecuencia, `@claude` no hace nada en los PRs de Dependabot (autor
    # CONTRIBUTOR). Es a propósito: su cuerpo incluye las release notes de la
    # dependencia, que escribe quien la mantiene. Esos PRs se revisan con Claude
    # en local.
    if: |
      (github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) ||
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    # Misma imagen que ci.yml y deploy.yml.
    runs-on: ubuntu-latest
    # Una revisión tarda unos minutos. El límite evita que un run colgado se
    # cobre durante las seis horas por defecto.
    timeout-minutes: 30
    # Un solo run por PR a la vez: un segundo `@claude` espera al primero, y dos
    # runs nunca publican revisiones solapadas ni hacen push a la misma rama. Va
    # en el job y no en el workflow para que los comentarios sin `@claude` no
    # entren en el grupo (GitHub deja un único run pendiente por grupo y
    # cancelaría la revisión en cola).
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # permite al revisor leer los resultados del CI
    outputs:
      posted: ${{ steps.posted.outputs.posted }}
    steps:
      # Falla cerrado: si la consulta falla o el fork ya no existe, `head` queda
      # vacío y el run se detiene.
      - name: Refuse to run on pull requests from forks
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.pull_request && github.event.issue.number || github.event.pull_request.number }}
        run: |
          [ -z "$PR" ] && exit 0
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.head.repo.full_name // ""') || head=
          if [ "$head" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::PR #$PR comes from ${head:-an unknown repository}, not $GITHUB_REPOSITORY. Claude does not run on fork PRs: review it by hand."
            exit 1
          fi

      # Las acciones de este job van fijadas a un SHA, no a un tag: un tag se
      # puede mover a otro código, y este job tiene el token de Claude del repo.
      # Dependabot las sube con un PR mensual (bloque `github-actions` de
      # dependabot.yml, con 8 días de cooldown). Para subir una a mano,
      # resuelve el tag nuevo a su commit, actualiza el comentario y respeta la
      # cuarentena de 7 días del resto de dependencias.
      #
      # `persist-credentials: false`: la acción escribe su propio token en el
      # checkout antes de arrancar Claude, así que el token del job no tiene por
      # qué estar ahí. La guarda de abajo hace fetch anónimo, que un repo
      # público permite.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Un PR que edita este workflow no puede revisarse con él (ver la nota al
      # principio del archivo). Falla antes, y en rojo, para que un check
      # `claude` verde siempre signifique que hubo revisión.
      #
      # La comparación replica la de la acción: en `pull_request` el checkout es
      # el commit de MERGE, así que un PR que no toca este archivo coincide con
      # la rama base aunque esta haya avanzado. Solo los runs de `pull_request`
      # dejan un check en el PR, así que solo ellos necesitan la guarda.
      - name: Refuse to no-op when this PR edits the review workflow
        if: github.event_name == 'pull_request'
        run: |
          git fetch --quiet --depth=1 origin "$GITHUB_BASE_REF"
          if ! git diff --quiet FETCH_HEAD -- .github/workflows/claude.yml; then
            echo "::error file=.github/workflows/claude.yml::This PR edits the review workflow, so claude-code-action would refuse to run and exit green having reviewed nothing. Failing instead: review this PR by hand. The edit takes effect on merge, and the first later PR that does not touch this file is what proves it."
            exit 1
          fi

      # El plugin de revisión, fijado a un commit como la acción. La vía
      # documentada (`plugin_marketplaces`) lee el catálogo de la rama por
      # defecto de ese repo, y cada revisión ejecutaría lo que hubiera llegado
      # ese día a `main`, con el token y las herramientas de este job.
      #
      # Se carga con `--plugin-dir` (en `claude_args`), no como marketplace:
      # Claude Code solo acepta el nombre `claude-plugins-official` desde la org
      # `anthropics` en GitHub, y como marketplace local lo rechaza y la acción
      # se para antes de arrancar Claude.
      #
      # Dependabot no sube este `ref:`. Muévelo a mano: elige un commit que toque
      # plugins/code-review y tenga al menos 7 días.
      - name: Check out the review plugin at a pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anthropics/claude-plugins-official
          ref: 9780cf407f5593727b668bae95a0c4ae2e0de1ae # code-review 1.0.1, 2026-10-26
          path: .review-plugins
          persist-credentials: false

      # El checkout del plugin queda sin seguimiento. Un run de `@claude` que
      # haga commit podría incluirlo con `git add .`, así que git lo ignora.
      - name: Keep the plugin checkout out of git
        run: printf '%s\n' /.review-plugins >> .git/info/exclude

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Solo los comentarios, reviews y comentarios en línea de estas cuentas
          # llegan al prompt; los de cualquier otra se descartan. Si añades un
          # colaborador al repo, añádelo aquí o Claude no verá sus comentarios.
          include_comments_by_actor: "jzfgo,claude[bot]"

          additional_permissions: |
            actions: read

          # La revisión automática de `pull_request` funciona igual que una
          # re-revisión con `@claude`: modo tag, el mismo prompt por defecto
          # (título y cuerpo del PR, comentarios, archivos cambiados, CLAUDE.md)
          # y un único comentario de seguimiento que se edita en el sitio.
          # `track_progress` es lo que fuerza el modo tag en este evento: sin él,
          # un `prompt` activa el modo agente, que no tiene herramienta para
          # publicar, y el run acaba en verde sin que nadie pueda leer la
          # revisión. El prompt hace de comentario que habría escrito una
          # persona, y la acción lo añade como instrucciones.
          #
          # No usa el plugin `code-review` para la revisión automática: ese
          # plugin solo conserva bugs de alta confianza e incumplimientos de
          # CLAUDE.md citables, y descarta casos límite, riesgos y huecos de
          # tests. Sigue instalado (`--plugin-dir` en `claude_args`), así que
          # `@claude /code-review:code-review` lo ejecuta cuando se pide.
          #
          # El resto de triggers pasa un prompt vacío y la acción sigue la
          # instrucción del comentario que mencionó a @claude.
          track_progress: ${{ github.event_name == 'pull_request' }}
          prompt: ${{ github.event_name == 'pull_request' && format('Review this pull request in full (HEAD {0}). Read the whole diff against the base branch and the code around it, and check it against the PR title and description and against every CLAUDE.md that covers the changed files. Report bugs, unhandled edge cases, risks, gaps in test coverage and mismatches with the description, and say which ones should block the merge. Post your findings in your comment even if there are none.', github.event.pull_request.head.sha) || '' }}

          # Publicar NO es un problema de permisos: la acción publica con su
          # propio token emitido por OIDC (de ahí `id-token: write`), y por eso
          # comenta con los permisos de solo lectura de arriba.

          # `--model` elige el revisor; sin él la acción usa Sonnet. v1 no tiene
          # input `model`, y `claude_args` es una sola cadena, así que comparte
          # línea con la lista de herramientas.
          #
          # `--allowedTools` es una lista de AUTOAPROBACIÓN, no de
          # disponibilidad: una herramienta que no está en ella existe, pero pide
          # permiso, y en CI nadie puede darlo, así que vuelve denegada. WebSearch
          # va en la lista para que el revisor compruebe afirmaciones contra
          # fuentes en vez de recordarlas.
          #
          # WebFetch se queda fuera a propósito. La acción escribe su token con
          # permisos de escritura en la URL de origin en `.git/config`, y Claude
          # puede leerlo (los comandos de shell de solo lectura se autoaprueban, y
          # un glob como `cat .g?t/c*` esquiva las reglas `Read(./.git/**)`).
          # WebFetch dejaría que un texto inyectado enviara ese token a cualquier
          # servidor.
          #
          # `mcp__github_inline_comment__create_inline_comment` es como el plugin
          # comenta en una línea. Listarlo es también lo que hace que la acción
          # arranque el servidor de esa herramienta.
          #
          # `--plugin-dir` carga el checkout fijado del plugin solo para esta
          # sesión. Sus comandos conservan el nombre del plugin:
          # `/code-review:code-review`.
          #
          # Este archivo no concede Bash a propósito. Una regla por prefijo no
          # puede filtrar argumentos: `Bash(gh api:*)` admite `-X POST` o
          # `-X DELETE` detrás, y `Bash(git:*)` admite `git -c <clave>=<cmd>` o
          # `--output=<archivo>`. El revisor lee código con Read y Grep, y marca
          # como no verificadas las afirmaciones sobre la configuración del repo.
          #
          # `--disallowedTools`: `ScheduleWakeup` siempre (ver el `env` del
          # paso). En los runs de `pull_request` se deniegan además los comandos
          # de escritura de git que permite el modo tag (`add`, `commit`, `rm`) y
          # las herramientas de edición que permitiría su `acceptEdits`: la
          # revisión automática solo lee y comenta. El modo tag también permite su
          # wrapper `scripts/git-push.sh`, que no se deniega: sin commit, en un PR
          # abierto no tiene nada que empujar. No se deniega todo `Bash`,
          # porque bloquearía `git diff` y `git log`, que es como el modo tag ve
          # el diff. Una regla de denegación gana a la lista de permitidos de la
          # acción. Un run de `@claude` conserva la escritura y la edición, así
          # que puede hacer push de un arreglo si se le pide.
          claude_args: '--model claude-opus-5-5 --plugin-dir ${{ github.workspace }}/.review-plugins/plugins/code-review --allowedTools "mcp__github_inline_comment__create_inline_comment,WebSearch" --disallowedTools "${{ github.event_name == ''pull_request'' && ''ScheduleWakeup,Bash(git add:*),Bash(git commit:*),Bash(git rm:*),Edit,MultiEdit,Write,NotebookEdit'' || ''ScheduleWakeup'' }}"'
        # Los subagentes deben ir en primer plano. En segundo plano, el agente
        # principal acaba su turno "esperándolos", la sesión headless sale ahí y
        # mueren antes de publicar, así que el run acaba en verde sin revisión.
        # La variable quita `run_in_background` de Agent y Bash, y la acción pasa
        # el entorno del paso a Claude. Pedir el primer plano en el prompt sería
        # solo una sugerencia; esto no deja elección.
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"

      # El modo tag crea el comentario de seguimiento antes de arrancar Claude,
      # así que un comentario en el PR no prueba que se publicara la revisión.
      # Tampoco cualquier edición: el agente publica primero su checklist con el
      # spinner de la acción y rellena los hallazgos al final. La revisión cuenta
      # como publicada si el agente hizo un comentario en línea, o si el último
      # cuerpo que escribió en el comentario de seguimiento ya no tiene el id de
      # imagen del spinner. Un agente que olvida quitar el spinner da una falsa
      # alarma, nunca un aprobado silencioso. `review-skipped` lee esta salida.
      - name: Check whether the agent posted its review
        id: posted
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          SPINNER_ID: 5ac382c7-e004-429b-8e35-7feb3e8f9c6f
        run: |
          posted=false
          if [ -f "$EXECUTION_FILE" ] && jq -e --arg spinner "$SPINNER_ID" '
            [.[] | select(.type == "assistant") | .message.content[]? | select(.type == "tool_use")] as $calls
            | ($calls | any(.name == "mcp__github_inline_comment__create_inline_comment"))
              or ($calls | map(select(.name == "mcp__github_comment__update_claude_comment"))
                  | last | .input.body // "" | length > 0 and (contains($spinner) | not))
          ' "$EXECUTION_FILE" > /dev/null; then
            posted=true
          fi
          echo "posted=$posted" >> "$GITHUB_OUTPUT"

      # La acción oculta la salida del agente, y el log solo guarda cuántas
      # llamadas se denegaron. Este paso escribe en el resumen del job, desde el
      # archivo de ejecución que la acción deja en el runner, el mensaje final
      # del agente, las herramientas que llamó y las que se le denegaron.
      #
      # No el transcript entero ni `show_full_output`: el repo es público, el
      # resumen también, y el contenido de los archivos que leyó el agente se
      # queda fuera. Cada input se corta a 300 caracteres y el mensaje final a
      # 4000. Los inputs van en code spans para que un texto que el agente
      # repita (un `<!--`, por ejemplo) no oculte el resto del resumen.
      #
      # `always()`: el run fallido es el que más interesa leer.
      # `continue-on-error`: un diagnóstico no debe cambiar el resultado ni, vía
      # `needs`, impedir que `review-skipped` comente.
      - name: Summarise what the agent did
        if: always() && steps.claude.outputs.execution_file != ''
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          [ -f "$EXECUTION_FILE" ] || { echo "No execution file at $EXECUTION_FILE."; exit 0; }
          jq -r '
            def cut: tostring | if length > 300 then .[:300] + "…" else . end;
            def inline: cut | gsub("[\r\n]"; " ") | gsub("`"; "ʼ");
            (map(select(.type == "result")) | last) as $r
            | "## Claude run",
              "",
              "`\($r.subtype // "no result")`, is_error=\($r.is_error | if . == null then "?" else . end), \($r.num_turns // "?") turns, \($r.duration_ms | if . == null then "?" else ./1000 | floor end) s, $\($r.total_cost_usd // "?")",
              "",
              "### Final message",
              "",
              "```",
              ($r.result // "(none)" | if length > 4000 then .[:4000] + "…" else . end | gsub("```"; "ʼʼʼ")),
              "```",
              "",
              "### Tool calls",
              "",
              (map(select(.type == "assistant"))[]
                | (if .parent_tool_use_id then "subagent" else "main" end) as $who
                | .message.content[]? | select(.type == "tool_use")
                | "- \($who) `\(.name)`: `\(.input | inline)`"),
              "",
              "### Permission denials",
              "",
              (($r.permission_denials // []) | if length == 0 then "None." else
                (.[] | "- `\(.tool_name)`: `\(.tool_input | inline)`") end)
          ' "$EXECUTION_FILE" >> "$GITHUB_STEP_SUMMARY"

  # Un run puede acabar en verde sin haber publicado nada: el agente puede
  # terminar su turno sin escribir los hallazgos en el comentario de seguimiento
  # (tareas en segundo plano, límite de turnos). La acción deja entonces ese
  # comentario solo con su cabecera "Claude finished", que parece una revisión
  # limpia. Este job avisa en el PR de que no se publicó ninguna revisión.
  #
  # Es un job aparte para que su token de escritura nunca llegue al agente: el
  # job `claude` mantiene permisos de solo lectura. `needs` hace que espere y
  # que solo se ejecute si `claude` terminó bien, porque un run fallido ya es un
  # check rojo.
  review-skipped:
    needs: claude
    if: github.event_name == 'pull_request' && needs.claude.outputs.posted != 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment when the review posted nothing
        env:
          GH_TOKEN: ${{ github.token }}
          # Este job no hace checkout, y `gh pr comment` sin repo git ni GH_REPO
          # falla con "not a git repository".
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Delimitador sin comillas para que $RUN_URL se expanda; los backticks van escapados.
          gh pr comment "$PR" --body-file - <<MSG
          Revisión automática omitida: el run terminó sin publicar la revisión. Lo que hizo el agente está en el resumen del run: $RUN_URL

          Si quieres una revisión, comenta \`@claude\` pidiéndola.
          MSG

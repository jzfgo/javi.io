name: Claude Code
run-name: "Claude — #${{ github.event.issue.number || github.event.pull_request.number }}"

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Cada trigger exige que tanto quien comenta como el autor del PR sean de
    # confianza: el agente puede leer el token con permisos de escritura de la
    # acción, así que nada escrito por alguien de fuera debe llegar al prompt.
    # Por eso `@claude` no hace nada en los PRs de Dependabot. Es a propósito:
    # su cuerpo incluye las release notes de la dependencia, que escribe quien
    # la mantiene. Esos PRs se revisan con Claude en local.
    if: |
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    # Misma imagen que ci.yml y deploy.yml, para que el cambio a ubuntu-latest
    # cuando Playwright soporte 26.04 (JAV-252) incluya también este fichero.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Un solo run por PR a la vez: un segundo `@claude` espera al primero. Va
    # en el job y no en el workflow para que los comentarios sin `@claude` no
    # entren en el grupo (GitHub deja un único run pendiente por grupo y
    # cancelaría la revisión en cola).
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # permite al revisor leer los resultados del CI
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Solo los comentarios de estas cuentas llegan al prompt. Si añades un
          # colaborador al repo, añádelo aquí o Claude no verá sus comentarios.
          include_comments_by_actor: "jzfgo,claude[bot]"
          additional_permissions: |
            actions: read

name: CI

# `deploy.yml` sólo se dispara en push a master, así que hasta ahora un PR no se
# validaba hasta DESPUÉS de mergearlo. Este workflow adelanta esa señal al PR.
#
# El paso decisivo es `pnpm install --frozen-lockfile`: además de comprobar que el
# lockfile está sincronizado, aplica el `minimumReleaseAge` de pnpm-workspace.yaml.
# Un PR de Dependabot abierto el mismo día en que se publicó el paquete fallará
# aquí, en vez de tumbar el deploy de master tras el merge.

on:
  pull_request:
    branches: [master]

# Un push nuevo al PR cancela la ejecución anterior: sin colas inútiles.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    # Misma imagen que deploy.yml. Si divergen, CI puede pasar y el deploy
    # fallar. Junto con los
    # pasos de Playwright y del CV de abajo, esto detecta en el PR fallos como
    # el de #44 (Playwright sin soporte para la imagen del runner).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # Node 24 y caché de pnpm igual que en deploy.yml: si divergen, CI puede
      # pasar y el deploy fallar, que es justo lo que este workflow evita.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # `pnpm build` ejecuta `astro check` internamente, así que esto cubre
      # también el type-checking.
      - name: Build
        run: pnpm build

      # Mismos pasos de Playwright y del CV que deploy.yml, para que un fallo
      # suyo aparezca en el PR y no después del merge. La clave de caché se
      # calcula igual; ver los comentarios en deploy.yml.
      - name: Compute Playwright cache key
        id: pw-key
        run: |
          pw_version="$(pnpm exec playwright --version | awk '{print $2}')"
          key="playwright-chromium-${ImageOS}-${pw_version}"
          echo "Playwright cache key: ${key}"
          echo "key=${key}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pw-key.outputs.key }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate CV documents
        run: node scripts/generate-pdf.mjs && node scripts/generate-docx.mjs

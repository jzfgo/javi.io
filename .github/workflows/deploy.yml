name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

# Dos merges seguidos no deben pisarse al hacer push a gh-pages: los deploys van
# en fila. Sin cancel-in-progress para no cortar un push a medias.
concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    # Fijado temporalmente: Playwright aún no soporta Ubuntu 26.04 (el actual
    # ubuntu-latest). Volver a ubuntu-latest cuando lo soporte, a la vez que en
    # ci.yml: ambos workflows deben correr en la misma imagen.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for git log --format=%cs to find correct commit

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # El SO y la imagen van en la clave para no restaurar un Chromium
          # descargado para otra versión de Ubuntu.
          key: playwright-chromium-${{ runner.os }}-${{ env.ImageOS }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-chromium-${{ runner.os }}-${{ env.ImageOS }}-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build site
        run: pnpm run build

      - name: Generate CV documents
        run: node scripts/generate-pdf.mjs && node scripts/generate-docx.mjs

      - name: Deploy to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
          pnpm run deploy


version: 2

# Este repo NO usa version updates: sólo recibe security updates, que GitHub
# dispara desde los advisories y que NO respetan `schedule` ni `cooldown`.
# Este archivo existe únicamente para AGRUPAR esos PRs de seguridad en uno solo.
#
# Para activar version updates, sustituir `open-pull-requests-limit: 0` por un
# número > 0 y añadir un bloque `schedule:` (y opcionalmente `cooldown:`).

updates:
  # `npm` es también el ecosistema de pnpm — no existe un valor `pnpm`.
  # Dependabot detecta el gestor por el lockfile (aquí lockfileVersion 9.0).
  - package-ecosystem: "npm"
    directory: "/"

    # 0 desactiva las version updates. Los security updates siguen llegando:
    # tienen su propio límite interno de 10 PRs abiertos, no configurable.
    open-pull-requests-limit: 0

    groups:
      # `applies-to: security-updates` es lo que hace que el grupo aplique al
      # motor de seguridad; sin esta clave el grupo sólo afectaría a version
      # updates, que aquí están apagadas (es decir, no haría nada).
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

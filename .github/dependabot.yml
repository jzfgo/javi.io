version: 2

# Las dependencias npm NO usan version updates: sólo reciben security updates,
# que GitHub dispara desde los advisories y que NO respetan `schedule` ni
# `cooldown`. El bloque `npm` existe únicamente para AGRUPAR esos PRs de
# seguridad en uno solo.
#
# Para activar version updates de npm, sustituir `open-pull-requests-limit: 0`
# por un número > 0 (y opcionalmente añadir `cooldown:`).
#
# Las GitHub Actions sí tienen version updates (bloque `github-actions`, abajo).

updates:
  # `npm` es también el ecosistema de pnpm — no existe un valor `pnpm`.
  # Dependabot detecta el gestor por el lockfile (aquí lockfileVersion 9.0).
  - package-ecosystem: "npm"
    directory: "/"

    # `schedule` es OBLIGATORIO aunque las version updates estén apagadas: sin él
    # el archivo es inválido y Dependabot lo ignora entero (grupos, labels,
    # prefijo). Con `open-pull-requests-limit: 0` no abre ningún PR semanal.
    schedule:
      interval: "weekly"

    # 0 desactiva las version updates. Los security updates siguen llegando:
    # tienen su propio límite interno de 10 PRs abiertos, no configurable.
    open-pull-requests-limit: 0

    groups:
      # `applies-to: security-updates` es lo que hace que el grupo aplique al
      # motor de seguridad; sin esta clave el grupo sólo afectaría a version
      # updates, que aquí están apagadas (es decir, no haría nada).
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

  # ── GitHub Actions ────────────────────────────────────────────────────────
  # Version updates activas, a diferencia de npm. `claude.yml` fija sus actions
  # a un SHA, y sin esto nadie las subiría nunca; Dependabot actualiza el SHA y
  # el comentario `# vX.Y.Z` a la vez. El resto de workflows usan tags de major
  # (`@v7`) y solo recibirán PRs al salir un major nuevo.
  #
  # El `cooldown` de 8 días cubre la cuarentena de 7 que aplica el resto de
  # dependencias: un tag de action comprometido es una vía directa al CI, que
  # tiene el token de Claude y el de deploy. Un PR agrupado al mes.
  #
  # No cubre el `ref:` del plugin de revisión en `claude.yml`: ese se mueve a
  # mano (ver el comentario junto a él).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 8
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]
